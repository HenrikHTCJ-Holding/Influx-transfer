trigger:
  branches:
    include:
      - main

pr: none

# Deploy-only pipeline (Azure Function App).
# Uses a Microsoft-hosted agent.

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: pythonVersion
    value: '3.11'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
    displayName: 'Use Python $(pythonVersion)'

  - task: Bash@3
    displayName: 'Vendor Python dependencies for Linux Functions'
    inputs:
      targetType: 'inline'
      workingDirectory: '$(Build.SourcesDirectory)'
      script: |
        set -euo pipefail
        python -m pip install --upgrade pip
        rm -rf .python_packages
        pip install -r requirements.txt -t .python_packages/lib/site-packages

  - task: AzureCLI@2
    displayName: 'Deploy Azure Function (zip deploy)'
    inputs:
      azureSubscription: 'FuncAPP_InfluxDB'
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        $srcRoot = "$(Build.SourcesDirectory)"
        $zipPath = "$(Build.ArtifactStagingDirectory)/deploy.zip"

        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        # IMPORTANT: Zip from repo root with relative paths so files land in wwwroot correctly.
        Push-Location $srcRoot
        try {
          # Deploy classic Python functions only. Including `function_app.py` (v2 model) can confuse
          # discovery on some Flex Consumption hosts ("Reading functions metadata (Custom)").
          # Use `tar` to preserve all files including hidden items.
          tar -a -c -f $zipPath host.json requirements.txt src influx_to_sql_transfer .python_packages
          if ($LASTEXITCODE -ne 0) { throw "tar packaging failed with exit code $LASTEXITCODE" }

          $functionJsonEntry = (tar -tf $zipPath | Select-String -SimpleMatch "influx_to_sql_transfer/function.json")
          if (-not $functionJsonEntry) {
            throw "Packaging verification failed: influx_to_sql_transfer/function.json not found in $zipPath"
          }
        } finally {
          Pop-Location
        }

        # Flex Consumption does not support SCM_DO_BUILD_DURING_DEPLOYMENT; remove if present.
        az functionapp config appsettings delete `
          --resource-group 'InfluxDB' `
          --name 'InfluxDBPy' `
          --setting-names SCM_DO_BUILD_DURING_DEPLOYMENT

        az functionapp config appsettings set `
          --resource-group 'InfluxDB' `
          --name 'InfluxDBPy' `
          --settings `
            FUNCTIONS_EXTENSION_VERSION=~4 `
            SQL_CONNECTION_STRING="$(SQL_CONNECTION_STRING)" `
            INFLUX_URL="$(INFLUX_URL)" `
            INFLUX_TOKEN="$(INFLUX_TOKEN)" `
            INFLUX_ORG="$(INFLUX_ORG)" `
            INFLUX_BUCKET="$(INFLUX_BUCKET)" `
            INFLUX_MEASUREMENT="$(INFLUX_MEASUREMENT)" `
            INFLUX_FIELDS="$(INFLUX_FIELDS)"

        az functionapp deployment source config-zip `
          --resource-group 'InfluxDB' `
          --name 'InfluxDBPy' `
          --src $zipPath

        az functionapp restart `
          --resource-group 'InfluxDB' `
          --name 'InfluxDBPy'
